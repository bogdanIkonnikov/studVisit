spring.datasource.url=jdbc:h2:mem:studvisit-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.security.jwt.access-secret=01234567890123456789012345678901
app.security.jwt.refresh-secret=abcdefghijklmnopqrstuvwxyz123456
app.security.jwt.access-expiration-ms=900000
app.security.jwt.refresh-expiration-ms=604800000

app.bootstrap.admin.username=admin
app.bootstrap.admin.password=admin123
