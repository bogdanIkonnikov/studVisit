spring.application.name=studVisit
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

app.security.jwt.access-secret=${JWT_ACCESS_SECRET}
app.security.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.bootstrap.admin.username=${APP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}
